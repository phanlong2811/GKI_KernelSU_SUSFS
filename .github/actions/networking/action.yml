name: 'Setup Networking'
description: 'Set up all networking options (IP Set, TCP CC, Qdisc, BBRv3, Wireguard)'
inputs:
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Networking Configs
      uses: ./.github/actions/networking-config

    - name: Apply BBRv3 Patches
      uses: ./.github/actions/bbrv3
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ inputs.sublevel }}

    # CIFS intentionally NOT enabled: CONFIG_CIFS=y/NETFS_SUPPORT=y (with netfs.ko
    # dropped from modules.bzl) kills mobile data on Xiaomi 25128PNA1C android16-6.12.

    - name: Setup CIFS (cifs-test branch only)
      uses: ./.github/actions/cifs
      with:
        version: ${{ inputs.version }}

    - name: Let stock netfs.ko load as already loaded (cifs-test branch only)
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: patch -p1 --forward --no-backup-if-mismatch < "${{ github.workspace }}/.github/patches/cifs/0001-module-treat-builtin-netfs-as-loaded.patch"
