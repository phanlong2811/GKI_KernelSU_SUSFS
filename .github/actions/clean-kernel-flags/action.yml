name: 'Clean Kernel Flags'
description: 'Clean dirty flags'

runs:
  using: "composite"
  steps:
    - name: Clean Dirty Flags and ABI Exports
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # Clean dirty flags and ABI exports based on build system
        if [ -f "build/build.sh" ]; then
          # Old build system (5.10, 5.15, early 6.1)
          sed -i 's/-dirty//' common/scripts/setlocalversion
        else
          # Bazel build system (newer kernels)
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" build/kernel/kleaf/impl/stamp.bzl
          sed -i 's/-dirty//' common/scripts/setlocalversion
        fi

        # Drop the maintainer-style "@" from the version banner (user@host -> user-host)
        # so /proc/version doesn't trip "@ mention" kernel identity checks
        grep -l 'LINUX_COMPILE_BY "@" LINUX_COMPILE_HOST' common/init/*.c 2>/dev/null \
          | xargs -r sed -i 's/LINUX_COMPILE_BY "@" LINUX_COMPILE_HOST/LINUX_COMPILE_BY "-" LINUX_COMPILE_HOST/'
        grep -n 'LINUX_COMPILE_BY' common/init/*.c || echo "WARNING: LINUX_COMPILE_BY banner not found"

        # Commit changes to avoid dirty state during build
        cd ${{ github.workspace }}/kernel/common
        git add .
        git commit -m "Wild: Clean Dirty Flag"
